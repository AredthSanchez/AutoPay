spring.application.name=autopay
spring.datasource.url=jdbc:h2:file:./data/autopay
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
autopay.username=${AUTOPAY_USERNAME:admin}
autopay.password=${AUTOPAY_PASSWORD:local-demo-change-me}
autopay.live=${AUTOPAY_LIVE:false}
autopay.public-url=${PUBLIC_BASE_URL:}
autopay.twilio.sid=${TWILIO_ACCOUNT_SID:}
autopay.twilio.token=${TWILIO_AUTH_TOKEN:}
autopay.twilio.from=${TWILIO_FROM_NUMBER:}
autopay.twilio.connector=${TWILIO_PAY_CONNECTOR:}
autopay.upload-dir=${UPLOAD_DIRECTORY:./data/attachments}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
